name: cosy_tool
description: "CosyTool - 基于 Flutter 的跨平台轻量工具箱，包含录音、分贝测试、延迟拍照、秒表、番茄钟等常用工具，手机与桌面端自适应。"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 录音 / 分贝测量
  record: ^7.1.1
  # 录音回放
  audioplayers: ^6.8.1
  # 应用文件目录
  path_provider: ^2.1.6
  # 延迟拍照（移动端）
  camera: ^0.12.1
  # 手电筒（移动端）
  torch_light: ^2.0.0
  # 二维码生成
  qr_flutter: ^4.1.0
  # 权限请求（12.x：兼容 AGP 9.1 compileSdk 36；13.x 要求 android-37）
  permission_handler: ^12.0.3
  # 本地偏好持久化（番茄钟统计、分贝校准等）
  shared_preferences: ^2.5.5
  # 保存照片到系统相册（延迟拍照）
  gal: ^2.3.3
  # 耳返：miniaudio 原生双工回环（<15ms） + AEC 防啸叫
  flutter_recorder: ^2.0.3
  # 文本阅读：Edge-TTS HTTP 服务
  http: ^1.2.0
  # TTS 语音缓存 / 文件哈希
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
